name: CI - Node, Express y Docker

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Construir y verificar proyecto
    runs-on: ubuntu-latest

    steps:
      - name: Hola Claudio
        run: echo "Hola Huancahuire!"

      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar sintaxis de Express
        run: node --check index.js

      - name: Construir imagen de Docker
        run: docker build -t mi-app-express:test .